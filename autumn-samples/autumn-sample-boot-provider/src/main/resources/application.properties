spring.application.name=provider-consul
# 显式指定 logback 配置：Boot 4 下 logback-spring.xml 不会被自动拾取（jar 与 native 同样），
# 不写这行会回落 logback 自带的默认配置，既没有自定义格式也没有 ./logs 文件日志
logging.config=classpath:logback-spring.xml
autumn.name=provider-consul
# multicast / consul
autumn.registry-type=consul
autumn.provider.port=30880
server.port=8080
# 多网卡 / 装了 Docker 的机器：自动探测会排除 docker0、br-*、veth* 等网桥。
# 若注册 IP 仍不对，可用命令行覆盖，例如：
#   --autumn.provider.ip=192.168.0.102
#   --autumn.network-interface=ens33
#   --autumn.preferred-networks=192.168.0.0/24
# 启动日志 "autumn host address selected" 会打印最终 IP 与网卡。








autumn.provider.max-threads=32
