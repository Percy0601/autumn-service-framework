spring.application.name=consumer
# 显式指定 logback 配置：Boot 4 下 logback-spring.xml 不会被自动拾取（jar 与 native 同样），
# 不写这行会回落 logback 自带的默认配置，既没有自定义格式也没有 ./logs 文件日志
logging.config=classpath:logback-spring.xml
autumn.name=consumer
# multicast / consul
autumn.registry-type=consul
# consumer app don't need thrift provider server
autumn.provider.enabled=true
autumn.provider.port=30881
server.port=8081
# 多网卡 / Docker 网桥环境：容器虚拟网卡会被自动排除；
# 如需强制指定，可用 --autumn.network-interface=ens33 或 --autumn.host-ip=192.168.0.103
